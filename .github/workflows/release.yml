name: Release

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish GitHub release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.release-metadata.outputs.version }}
      sha: ${{ steps.release-metadata.outputs.sha }}
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require the main branch
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            test "$RELEASE_REF" = "refs/heads/main" || {
              echo "Manual releases must run from refs/heads/main, not $RELEASE_REF." >&2
              exit 1
            }
          else
            test "$RELEASE_HEAD_BRANCH" = "main"
          fi

      - name: Check out the protected main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require main to equal the validated commit
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$RELEASE_SHA" || {
            echo "Protected main advanced to $checked_out_sha after validation of $RELEASE_SHA; the newer validation run will publish it." >&2
            exit 1
          }

      - name: Verify stage-to-main promotion
        if: github.event_name == 'workflow_run'
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          promotion_pr="$(gh api "repos/$GH_REPO/commits/$RELEASE_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main" and .head.ref == "stage")] | first | .number // empty')"
          test -n "$promotion_pr" || {
            echo "Commit $RELEASE_SHA is not associated with a merged stage -> main pull request." >&2
            exit 1
          }
          echo "Releasing promotion PR #$promotion_pr."

      - name: Verify release version
        id: release-metadata
        run: |
          set -euo pipefail
          node scripts/version.mjs release-check --allow-existing
          version="$(tr -d '[:space:]' < version.txt)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Build immutable release artifacts
        run: |
          node scripts/build-release.mjs "$RUNNER_TEMP/release"
          for archive in "$RUNNER_TEMP"/release/*.zip; do unzip -t "$archive" >/dev/null; done
          (cd "$RUNNER_TEMP/release" && sha256sum --check CHECKSUMS.sha256)

      - name: Create or repair the GitHub release
        env:
          VERSION: ${{ steps.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          notes="$RUNNER_TEMP/release-notes.md"
          node scripts/version.mjs notes > "$notes"
          cat >> "$notes" <<CHECKLIST

          ---
          ## Review-portal follow-ups (manual — no CI API exists)

          - OpenAI Platform: create a new draft of the Locus app from this
            release, resubmit for review, and publish after approval.
            Publishing also creates the Codex directory plugin.
          - Cursor: request a re-index at cursor.com/marketplace/publish
            (listing now centralized via cursor.directory) after this release.
          - Confirm \`com.paywithlocus/locus@$VERSION\` is listed in the MCP
            Registry. Downstream directories (Glama, PulseMCP) sync from it.
          CHECKLIST

          if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
            tagged_sha="$(git rev-parse "$tag^{}")"
            test "$tagged_sha" = "$RELEASE_SHA" || {
              echo "$tag already points to $tagged_sha, not $RELEASE_SHA." >&2
              exit 1
            }
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP"/release/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$RUNNER_TEMP"/release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "$tag" \
              --notes-file "$notes" \
              --latest
          fi

      - name: Record publication boundaries
        env:
          VERSION: ${{ steps.release-metadata.outputs.version }}
        run: |
          {
            echo "## Release v$VERSION"
            echo
            echo "Published automatically: immutable GitHub release and assets; git-backed Claude Code, Codex, Grok, OpenClaw, Agent Plugins, and Agent Skills sources now resolve the promoted main commit."
            echo
            echo "Review-gated: OpenAI's universal Plugins Directory and Cursor's public Marketplace require a new reviewed portal submission and cannot be published by this workflow."
            echo
            echo "The attached agent-skills-index.json is the exact digest-stamped payload to promote into AgentPay's public .well-known discovery index."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-mcp-registry:
    name: Publish MCP Registry metadata
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ needs.release.outputs.sha }}
      VERSION: ${{ needs.release.outputs.version }}
      MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
    steps:
      - name: Check out the protected main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Require main to equal the released commit
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$RELEASE_SHA" || {
            echo "Protected main advanced to $checked_out_sha while releasing $RELEASE_SHA; rerun the newer validated release." >&2
            exit 1
          }

      - name: Check for an existing immutable registry version
        id: registry-version
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            "https://registry.modelcontextprotocol.io/v0.1/servers?search=com.paywithlocus%2Flocus&version=$VERSION")"
          count="$(jq '[.servers[] | select(.server.name == "com.paywithlocus/locus" and .server.version == env.VERSION)] | length' <<< "$response")"
          if [[ "$count" == "1" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "com.paywithlocus/locus@$VERSION is already published; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require the DNS publishing credential
        if: steps.registry-version.outputs.exists != 'true'
        run: |
          test -n "$MCP_PRIVATE_KEY" || {
            echo "MCP_PRIVATE_KEY is required to publish the existing com.paywithlocus namespace." >&2
            echo "Set it to the 64-character hex Ed25519 private key matching the public MCPv1 TXT record on paywithlocus.com (see AGENTS.md)." >&2
            exit 1
          }
          if ! [[ "$MCP_PRIVATE_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "MCP_PRIVATE_KEY has the wrong shape: mcp-publisher expects the raw 32-byte Ed25519 seed as 64 hex characters (no 0x prefix, no PEM armor)." >&2
            echo "Derive it from the original key.pem with: openssl pkey -in key.pem -noout -text | grep -A3 'priv:' | tail -n +2 | tr -d ' :\n'" >&2
            exit 1
          fi

      - name: Install the pinned MCP publisher
        if: steps.registry-version.outputs.exists != 'true'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher

      - name: Publish the immutable MCP Registry version
        if: steps.registry-version.outputs.exists != 'true'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mcp-publisher" login dns \
            --domain paywithlocus.com \
            --private-key "$MCP_PRIVATE_KEY"
          "$RUNNER_TEMP/mcp-publisher" publish

      - name: Verify the published MCP Registry version
        if: steps.registry-version.outputs.exists != 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            count="$(curl --fail --silent --show-error \
              "https://registry.modelcontextprotocol.io/v0.1/servers?search=com.paywithlocus%2Flocus&version=$VERSION" \
              | jq '[.servers[] | select(.server.name == "com.paywithlocus/locus" and .server.version == env.VERSION)] | length')"
            [[ "$count" == "1" ]] && exit 0
            echo "Registry verification attempt $attempt did not find v$VERSION yet."
            sleep 5
          done
          echo "The MCP Registry did not expose com.paywithlocus/locus@$VERSION after publication." >&2
          exit 1
