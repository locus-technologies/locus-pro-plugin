name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Claude plugin and marketplace manifests
        run: |
          npx -y @anthropic-ai/claude-code plugin validate . --strict
          npx -y @anthropic-ai/claude-code plugin validate .claude-plugin/marketplace.json --strict

      - name: Check manifest consistency
        run: node scripts/check-manifests.mjs

  validate-grok:
    name: Validate Grok plugin manifest
    runs-on: ubuntu-latest
    env:
      GROK_BIN_DIR: ${{ github.workspace }}/.grok-bin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Grok CLI
        run: |
          curl -fsSL https://x.ai/cli/install.sh | bash -s 1.0.13
          echo "$GROK_BIN_DIR" >> "$GITHUB_PATH"

      - name: Validate Grok plugin manifest
        run: |
          grok version
          grok plugin validate .
